<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>RP Ebook Store - Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f7fb;
    color:#10233f;
    padding:20px;
}

.container{
    width:100%;
    max-width:1100px;
    margin:auto;
}

.hidden{
    display:none !important;
}

/* =========================
   LOGIN
========================= */

.login-box{
    max-width:430px;
    margin:70px auto;
    background:#fff;
    padding:30px;
    border-radius:16px;
    box-shadow:0 10px 35px rgba(0,0,0,.10);
}

.login-box h2{
    text-align:center;
    margin-bottom:8px;
    font-size:25px;
}

.login-box > p{
    text-align:center;
    color:#667085;
    margin-bottom:25px;
    font-size:14px;
}

/* =========================
   HEADER
========================= */

.header{
    background:#061d3a;
    color:#fff;
    padding:25px;
    border-radius:16px;
    margin-bottom:20px;
    position:relative;
}

.header h1{
    font-size:27px;
    margin-bottom:5px;
}

.header p{
    color:#cbd5e1;
    font-size:13px;
}

.logout{
    position:absolute;
    right:20px;
    top:20px;
    background:#ef4444;
    border:0;
    color:#fff;
    padding:10px 16px;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
}

.logout:hover{
    background:#dc2626;
}

/* =========================
   CARD
========================= */

.card{
    background:#fff;
    padding:25px;
    border-radius:15px;
    margin-bottom:20px;
    box-shadow:0 7px 25px rgba(0,0,0,.07);
}

.card h2{
    font-size:21px;
    margin-bottom:20px;
}

/* =========================
   FORM
========================= */

label{
    display:block;
    font-weight:bold;
    font-size:13px;
    margin:15px 0 7px;
}

input,
textarea,
select{
    width:100%;
    border:1px solid #d7dee8;
    border-radius:8px;
    padding:12px;
    font-size:14px;
    outline:none;
    background:#fff;
}

input:focus,
textarea:focus,
select:focus{
    border-color:#2468b5;
    box-shadow:0 0 0 3px rgba(36,104,181,.10);
}

textarea{
    min-height:100px;
    resize:vertical;
}

/* =========================
   PRICE BOX
========================= */

.price-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.price-info{
    background:#f8fbff;
    border:1px solid #e2eaf3;
    border-radius:10px;
    padding:12px;
    margin-top:10px;
    font-size:13px;
}

.price-info strong{
    color:#118943;
}

/* =========================
   BUTTON
========================= */

.primary{
    width:100%;
    margin-top:20px;
    background:#f4b522;
    color:#111;
    border:0;
    border-radius:8px;
    padding:14px 20px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.primary:hover{
    background:#e2a719;
}

.message{
    margin-top:12px;
    font-size:13px;
    font-weight:bold;
}

/* =========================
   BOOK LIST
========================= */

.book{
    border:1px solid #e3e8ef;
    border-radius:12px;
    padding:15px;
    margin-bottom:15px;
    background:#fff;
    display:grid;
    grid-template-columns:100px 1fr;
    gap:15px;
}

.book img{
    width:100px;
    height:135px;
    object-fit:cover;
    border-radius:7px;
    background:#eee;
}

.book-content h3{
    font-size:17px;
    margin-bottom:8px;
}

.book-category{
    display:inline-block;
    background:#eaf2ff;
    color:#2768b5;
    padding:5px 9px;
    border-radius:15px;
    font-size:11px;
    font-weight:bold;
    margin-bottom:8px;
}

.book-description{
    color:#667085;
    font-size:12px;
    line-height:1.5;
    margin:8px 0;
}

/* =========================
   BOOK PRICE
========================= */

.book-prices{
    display:flex;
    align-items:center;
    gap:10px;
    margin:8px 0;
}

.original-price{
    color:#888;
    text-decoration:line-through;
    font-size:14px;
}

.sale-price{
    color:#118943;
    font-size:20px;
    font-weight:bold;
}

.discount{
    background:#e8f8ef;
    color:#118943;
    padding:4px 8px;
    border-radius:5px;
    font-size:11px;
    font-weight:bold;
}

/* =========================
   STATUS
========================= */

.status{
    font-size:12px;
    margin:8px 0;
}

/* =========================
   DELETE
========================= */

.danger{
    background:#dc2626;
    color:#fff;
    border:0;
    border-radius:6px;
    padding:9px 14px;
    cursor:pointer;
    font-weight:bold;
}

.danger:hover{
    background:#b91c1c;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    body{
        padding:10px;
    }

    .login-box{
        margin:30px auto;
        padding:22px;
    }

    .header{
        padding:20px;
        padding-right:100px;
    }

    .header h1{
        font-size:21px;
    }

    .logout{
        right:15px;
        top:15px;
        padding:8px 11px;
        font-size:12px;
    }

    .card{
        padding:18px;
    }

    .card h2{
        font-size:19px;
    }

    .price-grid{
        grid-template-columns:1fr;
        gap:0;
    }

    .book{
        grid-template-columns:75px 1fr;
        gap:12px;
    }

    .book img{
        width:75px;
        height:105px;
    }

    .book-content h3{
        font-size:14px;
    }

    .book-prices{
        flex-wrap:wrap;
        gap:7px;
    }

    .original-price{
        font-size:12px;
    }

    .sale-price{
        font-size:18px;
    }

    .discount{
        font-size:10px;
    }

}

</style>

</head>

<body>


<div class="container">


<!-- =====================================================
     LOGIN BOX
===================================================== -->

<div id="loginBox" class="login-box">

    <h2>🔐 Admin Login</h2>

    <p>
        RP Ebook Store Administration
    </p>


    <label>
        Admin Email
    </label>

    <input
        type="email"
        id="email"
        placeholder="Admin Email"
    >


    <label>
        Password
    </label>

    <input
        type="password"
        id="password"
        placeholder="Password"
    >


    <button
        class="primary"
        onclick="login()"
    >
        Login
    </button>


    <div
        id="loginMessage"
        class="message"
    ></div>

</div>



<!-- =====================================================
     ADMIN PANEL
===================================================== -->

<div
    id="adminPanel"
    class="hidden"
>


<!-- HEADER -->

<div class="header">

    <button
        class="logout"
        onclick="logout()"
    >
        Logout
    </button>

    <h1>
        📚 RP Ebook Store
    </h1>

    <p>
        Admin Dashboard
    </p>

</div>



<!-- =====================================================
     ADD EBOOK
===================================================== -->

<div class="card">

    <h2>
        ➕ Add New Ebook
    </h2>


    <!-- TITLE -->

    <label>
        Ebook Title
    </label>

    <input
        type="text"
        id="title"
        placeholder="Example: Railway GK 2026"
    >



    <!-- PRICES -->

    <div class="price-grid">

        <div>

            <label>
                Original Price (₹)
            </label>

            <input
                type="number"
                id="originalPrice"
                placeholder="Example: 99"
                min="1"
            >

        </div>


        <div>

            <label>
                Sale Price (₹)
            </label>

            <input
                type="number"
                id="price"
                placeholder="Example: 9"
                min="1"
            >

        </div>

    </div>


    <div
        id="discountPreview"
        class="price-info"
    >
        💰 Discount automatically दिखाई देगा।
    </div>



    <!-- CATEGORY -->

    <label>
        Category
    </label>

    <input
        type="text"
        id="category"
        placeholder="Example: Railway"
    >



    <!-- DESCRIPTION -->

    <label>
        Description
    </label>

    <textarea
        id="description"
        placeholder="Ebook description..."
    ></textarea>



    <!-- COVER -->

    <label>
        Cover Image
    </label>

    <input
        type="file"
        id="coverFile"
        accept="image/*"
    >



    <!-- PDF -->

    <label>
        PDF File
    </label>

    <input
        type="file"
        id="pdfFile"
        accept="application/pdf"
    >



    <!-- PUBLISHED -->

    <label>
        Published
    </label>

    <select id="published">

        <option value="true">
            Yes - Show on Website
        </option>

        <option value="false">
            No - Hide
        </option>

    </select>



    <!-- ADD BUTTON -->

    <button
        class="primary"
        onclick="addEbook()"
    >
        ➕ Add Ebook
    </button>


    <div
        id="addMessage"
        class="message"
    ></div>

</div>



<!-- =====================================================
     BOOK LIST
===================================================== -->

<div class="card">

    <h2>
        📚 Your Ebooks
    </h2>

    <div id="bookList">
        Loading...
    </div>

</div>


</div>

</div>



<script>

/* =====================================================
   SUPABASE CONFIGURATION
===================================================== */

const SUPABASE_URL =
"https://whtiyeyqcvbajschqbli.supabase.co";


const SUPABASE_KEY =
"sb_publishable_c8F6pYJre6Yj8KX3aKDdmA_PAyQeSXy";


const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);



/* =====================================================
   LOGIN
===================================================== */

async function login(){

    const email =
        document
        .getElementById("email")
        .value
        .trim();


    const password =
        document
        .getElementById("password")
        .value;


    const msg =
        document
        .getElementById("loginMessage");


    if(!email || !password){

        msg.textContent =
            "Please enter email and password.";

        return;
    }


    msg.textContent =
        "Logging in...";


    const { data, error } =
        await supabaseClient.auth
        .signInWithPassword({

            email:email,

            password:password

        });


    if(error){

        msg.textContent =
            "Login failed: " +
            error.message;

        return;
    }


    msg.textContent = "";


    showAdmin();

}



/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

    await supabaseClient
        .auth
        .signOut();


    document
        .getElementById("adminPanel")
        .classList
        .add("hidden");


    document
        .getElementById("loginBox")
        .classList
        .remove("hidden");

}



/* =====================================================
   SHOW ADMIN
===================================================== */

function showAdmin(){

    document
        .getElementById("loginBox")
        .classList
        .add("hidden");


    document
        .getElementById("adminPanel")
        .classList
        .remove("hidden");


    loadBooks();

}



/* =====================================================
   DISCOUNT CALCULATOR
===================================================== */

function calculateDiscount(){

    const original =
        Number(
            document
            .getElementById("originalPrice")
            .value
        );


    const sale =
        Number(
            document
            .getElementById("price")
            .value
        );


    const preview =
        document
        .getElementById("discountPreview");


    if(
        !original ||
        original <= 0 ||
        !sale ||
        sale <= 0
    ){

        preview.innerHTML =
            "💰 Discount automatically दिखाई देगा।";

        return;
    }


    if(sale > original){

        preview.innerHTML =
            "⚠️ Sale Price Original Price से अधिक नहीं हो सकता।";

        return;
    }


    const discount =
        Math.round(
            ((original - sale) / original) * 100
        );


    preview.innerHTML =
        `
        💰 Original Price:
        <del>₹${original}</del>
        &nbsp;&nbsp;

        Sale Price:
        <strong>₹${sale}</strong>

        &nbsp;&nbsp;

        🔥 ${discount}% OFF
        `;

}


document
.getElementById("originalPrice")
.addEventListener(
    "input",
    calculateDiscount
);


document
.getElementById("price")
.addEventListener(
    "input",
    calculateDiscount
);



/* =====================================================
   ADD EBOOK
===================================================== */

async function addEbook(){

    const title =
        document
        .getElementById("title")
        .value
        .trim();


    const originalPrice =
        Number(
            document
            .getElementById("originalPrice")
            .value
        );


    const price =
        Number(
            document
            .getElementById("price")
            .value
        );


    const category =
        document
        .getElementById("category")
        .value
        .trim();


    const description =
        document
        .getElementById("description")
        .value
        .trim();


    const published =
        document
        .getElementById("published")
        .value === "true";


    const coverFile =
        document
        .getElementById("coverFile")
        .files[0];


    const pdfFile =
        document
        .getElementById("pdfFile")
        .files[0];


    const msg =
        document
        .getElementById("addMessage");



    /* VALIDATION */

    if(!title){

        msg.textContent =
            "Ebook title is required.";

        return;

    }


    if(
        !originalPrice ||
        originalPrice <= 0
    ){

        msg.textContent =
            "Please enter a valid Original Price.";

        return;

    }


    if(
        !price ||
        price <= 0
    ){

        msg.textContent =
            "Please enter a valid Sale Price.";

        return;

    }


    if(price > originalPrice){

        msg.textContent =
            "Sale Price cannot be greater than Original Price.";

        return;

    }


    if(!coverFile){

        msg.textContent =
            "Please select a cover image.";

        return;

    }


    if(!pdfFile){

        msg.textContent =
            "Please select a PDF.";

        return;

    }



    msg.textContent =
        "Uploading files...";



    /* =================================================
       COVER UPLOAD
    ================================================= */

    const coverPath =
        Date.now() +
        "_" +
        sanitizeFileName(
            coverFile.name
        );


    const {
        error:coverError
    } =
        await supabaseClient
        .storage
        .from("ebook-covers")
        .upload(
            coverPath,
            coverFile
        );


    if(coverError){

        msg.textContent =
            "Cover upload failed: " +
            coverError.message;

        return;

    }



    /* =================================================
       COVER PUBLIC URL
    ================================================= */

    const {
        data:coverData
    } =
        supabaseClient
        .storage
        .from("ebook-covers")
        .getPublicUrl(
            coverPath
        );


    const coverUrl =
        coverData.publicUrl;



    /* =================================================
       PDF UPLOAD
    ================================================= */

    const pdfPath =
        Date.now() +
        "_" +
        sanitizeFileName(
            pdfFile.name
        );


    const {
        error:pdfError
    } =
        await supabaseClient
        .storage
        .from("ebook-pdfs")
        .upload(
            pdfPath,
            pdfFile
        );


    if(pdfError){

        msg.textContent =
            "PDF upload failed: " +
            pdfError.message;

        return;

    }



    /* =================================================
       DISCOUNT
    ================================================= */

    const discount =
        Math.round(
            (
                (originalPrice - price) /
                originalPrice
            ) * 100
        );



    /* =================================================
       DATABASE INSERT
    ================================================= */

    const {
        error:dbError
    } =
        await supabaseClient
        .from("Ebooks")
        .insert({

            Title:title,

            OriginalPrice:
                originalPrice,

            Price:
                price,

            category:
                category,

            Description:
                description,

            cover_url:
                coverUrl,

            pdf_url:
                pdfPath,

            Published:
                published

        });


    if(dbError){

        msg.textContent =
            "Database error: " +
            dbError.message;

        return;

    }



    msg.innerHTML =
        `
        ✅ Ebook added successfully!
        <br>
        Original Price:
        <del>₹${originalPrice}</del>
        &nbsp;
        Sale Price:
        <strong>₹${price}</strong>
        &nbsp;
        ${discount}% OFF
        `;



    /* CLEAR FORM */

    document
        .getElementById("title")
        .value = "";


    document
        .getElementById("originalPrice")
        .value = "";


    document
        .getElementById("price")
        .value = "";


    document
        .getElementById("category")
        .value = "";


    document
        .getElementById("description")
        .value = "";


    document
        .getElementById("coverFile")
        .value = "";


    document
        .getElementById("pdfFile")
        .value = "";


    document
        .getElementById("discountPreview")
        .innerHTML =
        "💰 Discount automatically दिखाई देगा।";


    loadBooks();

}



/* =====================================================
   LOAD BOOKS
===================================================== */

async function loadBooks(){

    const list =
        document
        .getElementById("bookList");


    list.innerHTML =
        "Loading...";


    const {
        data,
        error
    } =
        await supabaseClient
        .from("Ebooks")
        .select("*")
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(error){

        list.innerHTML =
            "Error: " +
            error.message;

        return;

    }


    if(
        !data ||
        data.length === 0
    ){

        list.innerHTML =
            "No ebooks found.";

        return;

    }


    list.innerHTML = "";



    data.forEach(book => {

        const div =
            document.createElement("div");


        div.className =
            "book";


        const original =
            Number(
                book.OriginalPrice ||
                book.Price ||
                0
            );


        const sale =
            Number(
                book.Price ||
                0
            );


        let discount = 0;


        if(
            original > 0 &&
            sale > 0 &&
            sale <= original
        ){

            discount =
                Math.round(
                    (
                        (original - sale) /
                        original
                    ) * 100
                );

        }



        div.innerHTML =
        `

        ${
            book.cover_url
            ?
            `
            <img
                src="${escapeAttribute(book.cover_url)}"
                alt="${escapeAttribute(book.Title || "Ebook")}"
            >
            `
            :
            `
            <div
                style="
                    width:100px;
                    height:135px;
                    background:#eef2f7;
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    border-radius:7px;
                    font-size:30px;
                "
            >
                📖
            </div>
            `
        }


        <div class="book-content">

            <h3>
                ${escapeHtml(
                    book.Title ||
                    "Untitled Ebook"
                )}
            </h3>


            <span class="book-category">
                ${escapeHtml(
                    book.category ||
                    "Ebook"
                )}
            </span>


            <div class="book-prices">

                <span class="original-price">
                    ₹${original}
                </span>

                <span class="sale-price">
                    ₹${sale}
                </span>

                ${
                    discount > 0
                    ?
                    `
                    <span class="discount">
                        ${discount}% OFF
                    </span>
                    `
                    :
                    ""
                }

            </div>


            <p class="book-description">
                ${escapeHtml(
                    book.Description ||
                    ""
                )}
            </p>


            <div class="status">

                Status:

                ${
                    book.Published
                    ?
                    "🟢 Published"
                    :
                    "🔴 Hidden"
                }

            </div>


            <button
                class="danger"
                onclick="deleteBook('${escapeJs(String(book.id))}')"
            >
                🗑️ Delete
            </button>

        </div>

        `;


        list.appendChild(div);

    });

}



/* =====================================================
   DELETE BOOK
===================================================== */

async function deleteBook(id){

    if(
        !confirm(
            "Are you sure you want to delete this Ebook?"
        )
    ){

        return;

    }


    const {
        error
    } =
        await supabaseClient
        .from("Ebooks")
        .delete()
        .eq(
            "id",
            id
        );


    if(error){

        alert(
            "Delete failed: " +
            error.message
        );

        return;

    }


    alert(
        "Ebook deleted."
    );


    loadBooks();

}



/* =====================================================
   SANITIZE FILE NAME
===================================================== */

function sanitizeFileName(name){

    return String(name)
        .replace(
            /[^a-zA-Z0-9._-]/g,
            "_"
        );

}



/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHtml(text){

    const div =
        document.createElement("div");


    div.textContent =
        text == null
        ? ""
        : String(text);


    return div.innerHTML;

}



/* =====================================================
   ATTRIBUTE ESCAPE
===================================================== */

function escapeAttribute(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        );

}



/* =====================================================
   JAVASCRIPT ESCAPE
===================================================== */

function escapeJs(value){

    return String(value)

        .replace(
            /\\/g,
            "\\\\"
        )

        .replace(
            /'/g,
            "\\'"
        )

        .replace(
            /"/g,
            '\\"'
        )

        .replace(
            /\n/g,
            "\\n"
        )

        .replace(
            /\r/g,
            "\\r"
        );

}



/* =====================================================
   CHECK SESSION
===================================================== */

supabaseClient.auth
.getSession()
.then(
    ({data}) => {

        if(
            data &&
            data.session
        ){

            showAdmin();

        }

    }
);

</script>

</body>

</html>
