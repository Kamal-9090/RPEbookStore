<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RP Ebook Store - Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f7fb;
    color:#172033;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:20px;
}

.header{
    background:#111827;
    color:white;
    padding:20px;
    border-radius:16px;
    margin-bottom:20px;
}

.header h1{
    margin:0 0 5px;
}

.card{
    background:white;
    padding:20px;
    border-radius:16px;
    margin-bottom:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.06);
}

input,textarea,select{
    width:100%;
    padding:12px;
    margin:7px 0 15px;
    border:1px solid #d9dee8;
    border-radius:10px;
    font-size:15px;
}

textarea{
    min-height:100px;
    resize:vertical;
}

button{
    border:0;
    border-radius:10px;
    padding:12px 18px;
    cursor:pointer;
    font-weight:bold;
}

.primary{
    background:#111827;
    color:white;
}

.danger{
    background:#dc2626;
    color:white;
}

.logout{
    float:right;
    background:#ef4444;
    color:white;
}

.hidden{
    display:none;
}

.message{
    margin-top:10px;
    padding:10px;
    border-radius:8px;
    background:#eef2ff;
}

.book{
    border:1px solid #e5e7eb;
    border-radius:12px;
    padding:15px;
    margin-top:12px;
}

.book img{
    width:80px;
    height:100px;
    object-fit:cover;
    border-radius:8px;
    margin-bottom:10px;
}

.price{
    font-weight:bold;
    font-size:18px;
}

@media(max-width:600px){
    .container{
        padding:12px;
    }

    .header{
        border-radius:12px;
    }
}
</style>
</head>

<body>

<div class="container">

<!-- LOGIN -->
<div id="loginBox" class="card">

    <h2>🔐 Admin Login</h2>

    <p>RP Ebook Store Administration</p>

    <input
        type="email"
        id="email"
        placeholder="Admin Email"
    >

    <input
        type="password"
        id="password"
        placeholder="Password"
    >

    <button class="primary" onclick="login()">
        Login
    </button>

    <div id="loginMessage" class="message"></div>

</div>


<!-- ADMIN PANEL -->
<div id="adminPanel" class="hidden">

    <div class="header">

        <button class="logout" onclick="logout()">
            Logout
        </button>

        <h1>📚 RP Ebook Store</h1>

        <p>Admin Dashboard</p>

    </div>


    <!-- ADD EBOOK -->
    <div class="card">

        <h2>➕ Add New Ebook</h2>

        <label>Ebook Title</label>

        <input
            type="text"
            id="title"
            placeholder="Example: Railway GK 2026"
        >


        <label>Price (₹)</label>

        <input
            type="number"
            id="price"
            placeholder="Example: 49"
            min="1"
        >


        <label>Category</label>

        <input
            type="text"
            id="category"
            placeholder="Example: Railway"
        >


        <label>Description</label>

        <textarea
            id="description"
            placeholder="Ebook description..."
        ></textarea>


        <label>Cover Image</label>

        <input
            type="file"
            id="coverFile"
            accept="image/*"
        >


        <label>PDF File</label>

        <input
            type="file"
            id="pdfFile"
            accept="application/pdf"
        >


        <label>Published</label>

        <select id="published">
            <option value="true">Yes - Show on Website</option>
            <option value="false">No - Hide</option>
        </select>


        <button class="primary" onclick="addEbook()">
            ➕ Add Ebook
        </button>

        <div id="addMessage" class="message"></div>

    </div>


    <!-- BOOK LIST -->
    <div class="card">

        <h2>📚 Your Ebooks</h2>

        <div id="bookList">
            Loading...
        </div>

    </div>

</div>

</div>


<script>

/* ==============================
   SUPABASE CONFIG
============================== */

const SUPABASE_URL =
"https://whtiyeyqcvbajschqbli.supabase.co";

/*
Paste your Supabase Publishable Key
between the quotes below.
*/

const SUPABASE_KEY =
"sb_publishable_c8F6pYJre6Yj8KX3aKDdmA_PAyQeSXy";


const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* ==============================
   LOGIN
============================== */

async function login(){

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const msg =
        document.getElementById("loginMessage");

    if(!email || !password){

        msg.textContent =
            "Please enter email and password.";

        return;
    }

    msg.textContent = "Logging in...";

    const { data, error } =
        await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });

    if(error){

        msg.textContent =
            "Login failed: " + error.message;

        return;
    }

    msg.textContent = "";

    showAdmin();

}


/* ==============================
   LOGOUT
============================== */

async function logout(){

    await supabaseClient.auth.signOut();

    document
        .getElementById("adminPanel")
        .classList.add("hidden");

    document
        .getElementById("loginBox")
        .classList.remove("hidden");

}


/* ==============================
   SHOW ADMIN
============================== */

function showAdmin(){

    document
        .getElementById("loginBox")
        .classList.add("hidden");

    document
        .getElementById("adminPanel")
        .classList.remove("hidden");

    loadBooks();

}


/* ==============================
   ADD EBOOK
============================== */

async function addEbook(){

    const title =
        document.getElementById("title").value.trim();

    const price =
        Number(document.getElementById("price").value);

    const category =
        document.getElementById("category").value.trim();

    const description =
        document.getElementById("description").value.trim();

    const published =
        document.getElementById("published").value === "true";

    const coverFile =
        document.getElementById("coverFile").files[0];

    const pdfFile =
        document.getElementById("pdfFile").files[0];

    const msg =
        document.getElementById("addMessage");


    if(!title){

        msg.textContent =
            "Ebook title is required.";

        return;
    }

    if(!price || price <= 0){

        msg.textContent =
            "Please enter a valid price.";

        return;
    }

    if(!coverFile){

        msg.textContent =
            "Please select a cover image.";

        return;
    }

    if(!pdfFile){

        msg.textContent =
            "Please select a PDF.";

        return;
    }


    msg.textContent =
        "Uploading files...";


    /* COVER */

    const coverPath =
        Date.now() + "_" + coverFile.name;

    const { error: coverError } =
        await supabaseClient.storage
        .from("ebook-covers")
        .upload(coverPath, coverFile);


    if(coverError){

        msg.textContent =
            "Cover upload failed: " +
            coverError.message;

        return;
    }


    /* COVER URL */

    const { data: coverData } =
        supabaseClient.storage
        .from("ebook-covers")
        .getPublicUrl(coverPath);


    const coverUrl =
        coverData.publicUrl;


    /* PDF */

    const pdfPath =
        Date.now() + "_" + pdfFile.name;

    const { error: pdfError } =
        await supabaseClient.storage
        .from("ebook-pdfs")
        .upload(pdfPath, pdfFile);


    if(pdfError){

        msg.textContent =
            "PDF upload failed: " +
            pdfError.message;

        return;
    }


    /* DATABASE */

    const { error: dbError } =
        await supabaseClient
        .from("Ebooks")
        .insert({

            Title: title,

            Price: price,

            category: category,

            Description: description,

            cover_url: coverUrl,

            pdf_url: pdfPath,

            Published: published

        });


    if(dbError){

        msg.textContent =
            "Database error: " +
            dbError.message;

        return;
    }


    msg.textContent =
        "✅ Ebook added successfully!";


    document
        .getElementById("title")
        .value = "";

    document
        .getElementById("price")
        .value = "";

    document
        .getElementById("category")
        .value = "";

    document
        .getElementById("description")
        .value = "";

    document
        .getElementById("coverFile")
        .value = "";

    document
        .getElementById("pdfFile")
        .value = "";


    loadBooks();

}


/* ==============================
   LOAD BOOKS
============================== */

async function loadBooks(){

    const list =
        document.getElementById("bookList");

    list.innerHTML =
        "Loading...";


    const { data, error } =
        await supabaseClient
        .from("Ebooks")
        .select("*")
        .order("created_at", {
            ascending:false
        });


    if(error){

        list.innerHTML =
            "Error: " + error.message;

        return;
    }


    if(!data || data.length === 0){

        list.innerHTML =
            "No ebooks found.";

        return;
    }


    list.innerHTML = "";


    data.forEach(book => {

        const div =
            document.createElement("div");

        div.className = "book";


        div.innerHTML = `

            ${
                book.cover_url
                ?
                `<img src="${book.cover_url}">`
                :
                ""
            }

            <h3>${escapeHtml(book.Title)}</h3>

            <div class="price">
                ₹${book.Price}
            </div>

            <p>
                ${escapeHtml(book.category || "")}
            </p>

            <p>
                ${escapeHtml(book.Description || "")}
            </p>

            <p>
                Status:
                ${
                    book.Published
                    ? "🟢 Published"
                    : "🔴 Hidden"
                }
            </p>

            <button
                class="danger"
                onclick="deleteBook('${book.id}')">
                🗑️ Delete
            </button>

        `;

        list.appendChild(div);

    });

}


/* ==============================
   DELETE
============================== */

async function deleteBook(id){

    if(!confirm(
        "Are you sure you want to delete this Ebook?"
    )){
        return;
    }


    const { error } =
        await supabaseClient
        .from("Ebooks")
        .delete()
        .eq("id", id);


    if(error){

        alert(
            "Delete failed: " +
            error.message
        );

        return;
    }


    alert("Ebook deleted.");

    loadBooks();

}


/* ==============================
   HTML ESCAPE
============================== */

function escapeHtml(text){

    const div =
        document.createElement("div");

    div.textContent =
        text;

    return div.innerHTML;

}


/* ==============================
   CHECK SESSION
============================== */

supabaseClient.auth
.getSession()
.then(({data}) => {

    if(data.session){

        showAdmin();

    }

});

</script>

</body>
</html>
