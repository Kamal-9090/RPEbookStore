<!DOCTYPE html>
<html>
<head>
<title>Payment Successful</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    font-family: Arial, sans-serif;
    text-align:center;
    padding:30px;
    background:#f5f5f5;
}

.box{
    background:white;
    padding:25px;
    border-radius:12px;
    max-width:400px;
    margin:auto;
    box-shadow:0 0 10px #ccc;
}

button{
    background:#16a34a;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
}

#status{
    margin:20px;
}
</style>

</head>

<body>

<div class="box">

<h2>✅ Payment Successful</h2>

<p id="status">Payment verify ho raha hai...</p>

<a id="download" style="display:none;" target="_blank">
<button>Download Ebook PDF</button>
</a>

</div>


<script>

const params = new URLSearchParams(window.location.search);

const order_id = params.get("order_id");


/*
  IMPORTANT:
  Ye wahi ebook id honi chahiye
  jiska payment hua hai.
*/

const ebook_id = "1";


async function verifyPayment(){

try{

const response = await fetch(
"https://whtiyeyqcvbajschqbli.supabase.co/functions/v1/verify-payment",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
order_id:order_id,
ebook_id:ebook_id
})
}
);


const data = await response.json();


if(data.success){

document.getElementById("status").innerHTML =
"Payment Verified ✅";


const btn=document.getElementById("download");

btn.href=data.pdf_url;
btn.style.display="inline-block";


}
else{

document.getElementById("status").innerHTML =
data.message || "Payment pending";

}


}
catch(error){

document.getElementById("status").innerHTML =
"Error: "+error.message;

}

}


verifyPayment();

</script>

</body>
</html>
