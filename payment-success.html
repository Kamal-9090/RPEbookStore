<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Payment Successful</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px;
      background: #f5f5f5;
    }

    .box {
      background: white;
      padding: 25px;
      border-radius: 12px;
      max-width: 400px;
      margin: auto;
      box-shadow: 0 0 10px #ccc;
    }

    button {
      background: #16a34a;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    #status {
      margin: 20px;
      line-height: 1.6;
    }

    #download {
      display: none;
      text-decoration: none;
    }

  </style>

</head>


<body>

  <div class="box">

    <h2>✅ Payment Successful</h2>

    <p id="status">
      Payment verify ho raha hai...
    </p>

    <a
      id="download"
      target="_blank"
      rel="noopener"
    >

      <button>
        📥 Download Ebook
      </button>

    </a>

  </div>


  <script>

    // ==============================
    // GET PAYMENT DETAILS
    // ==============================

    const params =
      new URLSearchParams(
        window.location.search
      );

    const order_id =
      params.get("order_id");

    const ebook_id =
      params.get("ebook_id");


    const status =
      document.getElementById("status");

    const download =
      document.getElementById("download");


    // ==============================
    // CHECK PARAMETERS
    // ==============================

    if (!order_id) {

      status.innerHTML =
        "❌ Order ID नहीं मिला।";

    }

    else if (!ebook_id) {

      status.innerHTML =
        "❌ Ebook ID नहीं मिली।";

    }

    else {

      verifyPayment();

    }


    // ==============================
    // VERIFY PAYMENT
    // ==============================

    async function verifyPayment() {

      try {

        const response =
          await fetch(
            "https://whtiyeyqcvbajschqbli.supabase.co/functions/v1/verify-payment",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({

                order_id:
                  order_id,

                ebook_id:
                  ebook_id

              })

            }
          );


        const data =
          await response.json();


        // ==============================
        // PAYMENT SUCCESS
        // ==============================

        if (data.success) {

          status.innerHTML =
            "Payment Verified ✅<br><br>" +
            "<strong>" +
            (data.title || "Your Ebook") +
            "</strong>";


          if (data.pdf_url) {

            download.href =
              data.pdf_url;

            download.style.display =
              "inline-block";

          }

        }


        // ==============================
        // PAYMENT NOT COMPLETED
        // ==============================

        else {

          status.innerHTML =
            data.message ||
            data.error ||
            "Payment pending.";

        }


      }

      catch (error) {

        console.error(error);

        status.innerHTML =
          "❌ Error: " +
          error.message;

      }

    }

  </script>

</body>

</html>
